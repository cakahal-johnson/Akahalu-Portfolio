name: Backend CI

on:
  push:
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"

  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend quality and tests

    runs-on: ubuntu-24.04

    timeout-minutes: 25

    defaults:
      run:
        working-directory: backend

    env:
      ENVIRONMENT: local
      DEBUG: "false"

      DATABASE_URL: >-
        postgresql+psycopg://portfolio_user:portfolio_ci_password@127.0.0.1:5432/portfolio_test_db

      TEST_DATABASE_URL: >-
        postgresql+psycopg://portfolio_user:portfolio_ci_password@127.0.0.1:5432/portfolio_test_db

      REDIS_URL: redis://127.0.0.1:6379/0

      JWT_SECRET_KEY: >-
        ci-only-jwt-secret-not-for-production-akahalu-portfolio-2026

      CONTACT_HASH_SECRET_KEY: >-
        ci-only-contact-hash-secret-not-for-production-akahalu-portfolio-2026

    services:
      postgres:
        image: postgres:17-alpine

        env:
          POSTGRES_DB: portfolio_test_db
          POSTGRES_USER: portfolio_user
          POSTGRES_PASSWORD: portfolio_ci_password

        ports:
          - 5432:5432

        options: >-
          --health-cmd "pg_isready -U portfolio_user -d portfolio_test_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

        with:
          version: "0.11.29"
          working-directory: backend
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install Python
        run: uv python install 3.13

      - name: Install backend dependencies
        run: uv sync --locked --dev

      - name: Show tool versions
        run: |
          uv --version
          uv run python --version
          uv run ruff --version
          uv run mypy --version
          uv run pytest --version

      - name: Run Ruff
        run: uv run ruff check app scripts tests

      - name: Run mypy
        run: uv run mypy app scripts tests

      - name: Verify single Alembic head
        shell: bash

        run: |
          set -euo pipefail

          heads="$(uv run alembic heads)"

          printf '%s\n' "$heads"

          head_count="$(
            printf '%s\n' "$heads" |
            grep -c '(head)'
          )"

          if [ "$head_count" -ne 1 ]; then
            echo "Expected exactly one Alembic head."
            exit 1
          fi

      - name: Prepare PostgreSQL extensions
        run: |
          uv run python - <<'PY'
          import asyncio

          from sqlalchemy import text
          from sqlalchemy.ext.asyncio import create_async_engine

          from app.core.config import settings


          async def main() -> None:
              engine = create_async_engine(
                  settings.database_url,
                  isolation_level="AUTOCOMMIT",
              )

              try:
                  async with engine.connect() as connection:
                      for extension in (
                          "uuid-ossp",
                          "pgcrypto",
                          "citext",
                      ):
                          await connection.execute(
                              text(
                                  f'CREATE EXTENSION IF NOT EXISTS "{extension}"'
                              )
                          )
              finally:
                  await engine.dispose()


          asyncio.run(main())
          PY

      - name: Apply migrations to fresh PostgreSQL
        run: uv run alembic upgrade head

      - name: Show migrated revision
        run: uv run alembic current

      - name: Run backend test suite
        run: uv run pytest -q