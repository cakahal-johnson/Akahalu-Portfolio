name: ${COMPOSE_PROJECT_NAME:-akahalu-portfolio}

x-backend-image: &backend-image
  image: akahalu-portfolio-backend:${IMAGE_TAG:-local}

  build:
    context: .
    dockerfile: infrastructure/docker/backend.Dockerfile

x-backend-environment: &backend-environment
  env_file:
    - ./infrastructure/production.env


services:
  postgres:
    image: postgres:17-alpine

    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}

    volumes:
      - portfolio_postgres_data:/var/lib/postgresql/data
      - ./infrastructure/postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

    networks:
      - data-network


  redis:
    image: redis:8-alpine

    restart: unless-stopped

    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}

    command:
      [
        "sh",
        "-c",
        "exec redis-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\""
      ]

    volumes:
      - portfolio_redis_data:/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "redis-cli --no-auth-warning -a \"$$REDIS_PASSWORD\" ping | grep PONG"
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

    networks:
      - data-network


  migrate:
    <<:
      - *backend-image
      - *backend-environment

    command:
      [
        "alembic",
        "upgrade",
        "head"
      ]

    restart: "no"

    depends_on:
      postgres:
        condition: service_healthy

    networks:
      - data-network


  identity-bootstrap:
    <<:
      - *backend-image
      - *backend-environment

    command:
      [
        "python",
        "-m",
        "scripts.seed_identity",
        "--skip-admin"
      ]

    restart: "no"

    depends_on:
      migrate:
        condition: service_completed_successfully

    networks:
      - data-network


  backend:
    <<:
      - *backend-image
      - *backend-environment

    restart: unless-stopped

    init: true

    depends_on:
      postgres:
        condition: service_healthy

      redis:
        condition: service_healthy

      migrate:
        condition: service_completed_successfully

      identity-bootstrap:
        condition: service_completed_successfully

    networks:
      - web-network
      - data-network


  frontend:
    image: akahalu-portfolio-frontend:${IMAGE_TAG:-local}

    build:
      context: .
      dockerfile: infrastructure/docker/frontend.Dockerfile

      args:
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:?NEXT_PUBLIC_APP_URL is required}
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?NEXT_PUBLIC_API_URL is required}
        NEXT_PUBLIC_API_TIMEOUT_MS: ${NEXT_PUBLIC_API_TIMEOUT_MS:-15000}

    restart: unless-stopped

    init: true

    env_file:
      - ./infrastructure/production.env

    depends_on:
      backend:
        condition: service_healthy

    volumes:
      - portfolio_next_cache:/app/.next/cache

    networks:
      - web-network


  nginx:
    image: nginx:1.28-alpine

    restart: unless-stopped

    depends_on:
      backend:
        condition: service_healthy

      frontend:
        condition: service_healthy

    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${HTTP_PORT:-8080}:80"

    volumes:
      - ./infrastructure/nginx/portfolio.conf:/etc/nginx/conf.d/default.conf:ro

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q --spider http://127.0.0.1/healthz"
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

    networks:
      - web-network


volumes:
  portfolio_postgres_data:
  portfolio_redis_data:
  portfolio_next_cache:


networks:
  web-network:
    driver: bridge

  data-network:
    driver: bridge
    internal: true